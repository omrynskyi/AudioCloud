# annembed 0.1.6, vendored (`overview.md` §10, risk 2; `task.md` Phase 5).
#
# This is upstream 0.1.6's published source with **no changes to any `.rs` file**. The whole
# reason it is here is that the layout of the user's entire map depends on a 0.1.x crate
# with one maintainer, and a yank, a force-push, or an abandoned repository must not be able
# to break a build or silently change where a kick sits on the screen. `cargo vendor` would
# have done the same job for the whole tree; this is one crate, checked in, because it is
# the only one where that risk is worth 416 KB of git.
#
# Four deliberate edits, all to this manifest and none to the code:
#
# 1. `[[bin]]`, `[[example]]`, and `src/bin/` are gone. Cargo does not build a dependency's
#    binaries, so they were never compiled -- but their dependencies were. Dropping them
#    drops `clap`, `bincode`, `byteorder`, and `num_cpus` from the tree entirely; none is
#    referenced by a single line of the library.
# 2. The `python` feature and its `pyo3`/`numpy` dependencies are gone for the same reason.
#    `src/python.rs` is still here, still `#[cfg(feature = "python")]`, still never built.
# 3. `crate-type` is `rlib` only. The published `cdylib` is for the Python extension.
# 4. `[profile.release]` is gone. Cargo ignores a non-root package's profile and warns
#    about it; ours lives in `src-tauri/Cargo.toml`.
#
# **The version is not a range and must not become one.** Cross-cutting rule 7: a `path`
# dependency has no version to resolve, which is exactly the point -- upgrading means
# replacing this directory deliberately and re-running the projection tests, not a
# `cargo update`.

[package]
edition = "2024"
name = "annembed"
version = "0.1.6"
authors = ["jeanpierre.both@gmail.com"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "a Rust implementation of a dimension reduction à la Umap "
documentation = "https://docs.rs/annembed"
readme = "README.md"
keywords = ["algorithms", "ann", "embedding", "dimension-reduction", "umap"]
license = "MIT/Apache-2.0"
repository = "https://github.com/jean-pierreBoth/annembed"
publish = false

[features]
default = []
# The only backend AudioBank builds. `lax` is a hard dependency of this crate and its
# LAPACK symbols have to resolve against something; on macOS that something already ships
# with the OS. `build.rs` emits the framework link line.
macos-accelerate = ["blas-src", "ndarray/blas"]
intel-mkl-static = ["ndarray/blas", "lax/intel-mkl-static"]
openblas-static = ["ndarray/blas", "lax/openblas-static"]
openblas-system = ["ndarray/blas", "lax/openblas-system"]
simdeez_f = ["hnsw_rs/simdeez_f"]
stdsimd = ["hnsw_rs/stdsimd"]

[lib]
name = "annembed"
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
blas-src = { version = "0.14", features = ["accelerate"], optional = true }
bson = "2.10"
cpu-time = "1.0"
csv = "1.3"
env_logger = "0.11"
hdrhistogram = "7.5"
hnsw_rs = "0.3"
indexmap = "2.9"
indxvec = "1.9"
katexit = "0.1"
lax = "0.18"
lazy_static = "1.4"
log = "0.4"
memory-stats = { version = "1.1", features = ["always_use_statm"] }
ndarray = { version = ">=0.16.0, <0.18", features = ["rayon", "serde"] }
num-traits = "0.2"
parking_lot = "0.12"
permutation = "0.4"
quantiles = "0.7"
rand = "0.9"
rand_distr = "0.5"
rand_xoshiro = "0.7"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
sprs = "0.11"

[dev-dependencies]
statrs = "0.18"

# `src/python.rs` is still in the tree and still gated on a `python` feature this manifest
# no longer declares, so rustc warns about the `cfg` on every build. Allowed here rather
# than fixed by deleting the file: the code is upstream's, byte for byte, and keeping it
# that way is worth more than one silenced lint in a dependency.
[lints.rust]
unexpected_cfgs = { level = "allow" }
